<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokročilý Systém Tvorby Krabíc</title>
    <link rel="stylesheet" href="style.css">  
</head>
<body>
    <main id="app-content">
        <header>
            <h1>Pokročilý Systém Tvorby Krabíc</h1>
            <div class="view-switcher">
                <button id="toggle-view-btn">Zobraziť Svetový Čas</button>
            </div>
        </header>

        <div id="packing-view">
            <div id="form-container">
                <h2>Vytvoriť novú objednávku / balenie</h2>

                <!-- Základné údaje objednávky -->
                <div class="input-row">
                    <div class="input-group">
                        <label for="order-number">Číslo objednávky:</label>
                        <input type="text" id="order-number" placeholder="Zadajte číslo objednávky...">
                    </div>
                    <div class="input-group">
                        <label for="order-type-select">Typ objednávky:</label>
                        <select id="order-type-select">
                            <option value="">-- Vyberte typ --</option>
                            <option value="Sale">Sale</option>
                            <option value="Lease">Lease</option>
                            <option value="Internal">Internal</option>
                            <option value="Claim">Claim</option>
                        </select>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="customer-name">Meno zákazníka:</label>
                        <input type="text" id="customer-name" placeholder="Zadajte meno...">
                    </div>
                    <div class="input-group">
                        <label for="customer-address">Adresa:</label>
                        <input type="text" id="customer-address" placeholder="Zadajte adresu...">
                    </div>
                </div>

                <div class="input-group">
                    <label for="order-description">Popis objednávky (nepovinné):</label>
                    <textarea id="order-description" placeholder="Pridajte poznámky k objednávke..." rows="2"></textarea>
                </div>

                <hr>

                <!-- SEKCE VC ZARIADENIA -->
                <div class="product-section" id="section-vc">
                    <div class="section-header">
                        <h3>🔵 Zariadenia VC <span id="vc-count-badge" class="badge">0 ks</span></h3>
                    </div>
                    <div class="input-group">
                        <label for="vc-serial-numbers">Sériové čísla VC (X0000000):</label>
                        <textarea id="vc-serial-numbers" rows="2" placeholder="Napr. A1234567 A1234568 (oddelené novým riadkom alebo medzerou)..."></textarea>
                    </div>
                    <div class="preset-buttons" id="preset-buttons-vc">
                        <label>VC Predvoľby:</label>
                        <button type="button" data-preset="eu">EU Default</button>
                        <button type="button" data-preset="us">US Default</button>
                        <button type="button" data-preset="uk">UK Default</button>
                        <button type="button" data-preset="jpy">JPY Default</button>
                        <button type="button" data-clear="vc" class="btn-clear">Zrušiť výber</button>
                    </div>
                    <div id="vc-checkbox-container" class="checkbox-grid"></div>
                </div>

                <hr>

                <!-- SEKCE S/MC ZARIADENIA -->
                <div class="product-section" id="section-smc">
                    <div class="section-header">
                        <h3>🟢 Zariadenia S/MC <span id="smc-count-badge" class="badge">0 ks</span></h3>
                    </div>
                    <div class="input-row">
                        <div class="input-group" style="flex: 2;">
                            <label for="smc-serial-numbers">Sériové čísla S/MC (+ voliteľná veľkosť):</label>
                            <textarea id="smc-serial-numbers" rows="3" placeholder="Napr.:&#10;SEG-001 M&#10;SEG-002 L&#10;SEG-003 (použije predvolenú)"></textarea>
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label for="smc-default-size">Predvolená veľkosť:</label>
                            <select id="smc-default-size">
                                <option value="M">M</option>
                                <option value="S">S</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                            </select>
                            <small class="sn-help">Použije sa, ak nezadáte veľkosť priamo k SN.</small>
                        </div>
                    </div>

                    <div class="preset-buttons" id="preset-buttons-smc">
                        <label>S/MC Predvoľby:</label>
                        <button type="button" data-preset="smc">S/MC Default</button>
                        <button type="button" data-clear="smc" class="btn-clear">Zrušiť výber</button>
                    </div>
                    <div id="smc-checkbox-container" class="checkbox-grid"></div>
                </div>

                <hr>

                <!-- EXTRA POLOŽKY -->
                <div class="input-group">
                    <label for="extra-item-select">Pridať extra položku do balenia:</label>
                    <select id="extra-item-select">
                        <option value="">-- Vyberte položku --</option>
                    </select>
                </div>
                <div id="extra-checkbox-container" class="checkbox-grid"></div>

                <div class="actions-area">
                    <button id="save-box-btn" disabled>Uložiť krabicu / balenie</button>
                    <div id="validation-feedback"></div>
                </div>
            </div>

            <!-- SÚHRN -->
            <div id="summary-section">
                <h2>Celkový Súhrn</h2>
                <div id="saved-orders-content"></div>
                <div id="total-summary" class="hidden">
                    <h3>Celkové počty položiek na zabalenie</h3>
                    <div id="total-items-content"></div>
                </div>
                <button id="print-btn" class="hidden">Tlačiť Finálny Súhrn</button>
            </div>
        </div>

        <div id="clocks-view" class="hidden">
            <h2>Aktuálny Svetový Čas</h2>
            <div id="world-clocks-container"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
