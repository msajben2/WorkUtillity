<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokročilý Systém Tvorby Krabíc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="app-content">
        <header>
            <h1>Pokročilý Systém Tvorby Krabíc</h1>
            <div class="view-switcher">
                <button id="toggle-view-btn">Zobraziť Svetový Čas</button>
            </div>
        </header>

        <div id="packing-view">
            <div id="form-container">
                <h2>Vytvoriť novú krabicu</h2>

                <div class="input-group">
                    <label for="order-number">Číslo objednávky:</label>
                    <input type="text" id="order-number" placeholder="Zadajte číslo objednávky...">
                </div>
                <hr>

                <div class="input-row">
                    <div class="input-group">
                        <label for="customer-name">Meno zákazníka:</label>
                        <input type="text" id="customer-name" placeholder="Zadajte meno...">
                    </div>
                    <!-- Nové pole pre adresu -->
                    <div class="input-group">
                        <label for="customer-address">Adresa:</label>
                        <input type="text" id="customer-address" placeholder="Zadajte adresu...">
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Typ:</label>
                        <div class="radio-group">
                            <div class="radio-option"><input type="radio" id="type-vc" name="box-type" value="VC" checked><label for="type-vc">VC</label></div>
                            <div class="radio-option"><input type="radio" id="type-smc" name="box-type" value="S/MC"><label for="type-smc">S/MC</label></div>
                            <div class="radio-option"><input type="radio" id="type-other" name="box-type" value="Ostatné"><label for="type-other">Ostatné</label></div>
                        </div>
                    </div>
                    <div class="input-group hidden" id="size-selection-group">
                        <label for="size-select">Veľkosť:</label>
                        <select id="size-select">
                            <option value="">-- Vyberte veľkosť --</option>
                            <option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option>
                        </select>
                    </div>
                </div>

                <div class="input-group" id="sn-group">
                    <label for="serial-number">Sériové číslo (SN):</label>
                    <input type="text" id="serial-number" placeholder="Zadajte SN...">
                </div>
                
                <h3>Položky pre krabicu</h3>
                <div id="preset-buttons-vc" class="preset-buttons">
                    <label>VC Predvoľby:</label>
                    <button data-preset="eu">EU Default</button><button data-preset="us">US Default</button><button data-preset="uk">UK Default</button><button data-preset="jpy">JPY Default</button>
                </div>
                <div id="preset-buttons-smc" class="preset-buttons hidden">
                    <label>S/MC Predvoľby:</label>
                    <button data-preset="smc">S/MC Default</button>
                </div>

                <div id="checkbox-container"></div>

                <div class="input-group">
                     <label for="extra-item-select">Pridať extra položku:</label>
                     <select id="extra-item-select"><option value="">-- Vyberte položku --</option></select>
                </div>

                <button id="save-box-btn" disabled>Uložiť krabicu</button>
            </div>

            <div id="summary-section">
                <h2>Celkový Súhrn</h2>
                <div id="saved-orders-content"></div>
                <div id="total-summary">
                    <h3>Celkové počty položiek (vrátane aktuálne vybraných)</h3>
                    <div id="total-items-content"></div>
                </div>
                <button id="print-btn" class="hidden">Tlačiť Finálny Súhrn</button>
            </div>
        </div>

        <div id="clocks-view" class="hidden">
            <h2>Aktuálny Svetový Čas</h2>
            <div id="world-clocks-container"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
