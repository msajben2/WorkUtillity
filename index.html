<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systém na Tvorbu Krabíc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Tvorba a Súhrn Krabíc</h1>

    <div id="form-container">
        <h2>Vytvoriť novú krabicu</h2>
        <div class="input-group">
            <label for="serial-number">Sériové číslo (SN):</label>
            <input type="text" id="serial-number" placeholder="Zadajte SN...">
        </div>
        
        <h3>Položky pre krabicu</h3>
        <div id="checkbox-container">
            <!-- Checkboxy budú generované JavaScriptom -->
        </div>

        <button id="add-box-btn">Pridať krabicu do súhrnu</button>
    </div>

    <div id="summary-section">
        <h2>Celkový Súhrn</h2>
        <div id="summary-list">
            <!-- Sem sa budú pridávať zhrnutia jednotlivých krabíc -->
        </div>
        
        <div id="total-summary" class="hidden">
            <h3>Celkové počty položiek</h3>
            <div id="total-items-content"></div>
        </div>

        <hr>

        <h2>Globálne Nastavenia</h2>
        <div id="dropdown-container">
             <div class="dropdown-item">
                <label for="select-1">Možnosť 1:</label>
                <select id="select-1">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>
            <div class="dropdown-item">
                <label for="select-2">Možnosť 2:</label>
                <select id="select-2">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>
            <div class="dropdown-item">
                <label for="select-3">Možnosť 3:</label>
                <select id="select-3">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>
        </div>

        <button id="print-btn" class="hidden">Tlačiť Finálny Súhrn</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
