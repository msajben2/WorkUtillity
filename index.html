<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívny Formulár</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Môj Systém</h1>

    <div id="form-container">
        <h2>Položky na výber</h2>
        <div id="checkbox-container">
            <!-- Checkboxy budú generované JavaScriptom -->
        </div>

        <h2>Voliteľné možnosti</h2>
        <div id="dropdown-container">
            <div class="dropdown-item">
                <label for="select-1">Možnosť 1:</label>
                <select id="select-1">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>
            <div class="dropdown-item">
                <label for="select-2">Možnosť 2:</label>
                <select id="select-2">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>
            <div class="dropdown-item">
                <label for="select-3">Možnosť 3:</label>
                <select id="select-3">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>
        </div>

        <button id="summarize-btn">Vytvoriť súhrn a pripraviť na tlač</button>
    </div>

    <div id="summary-container" class="hidden">
        <h2>Súhrn pre tlač</h2>
        <div id="summary-content"></div>
        <button id="print-btn">Tlačiť</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
